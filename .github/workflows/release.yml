name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      SLUG: quick-adsense
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify tag and plugin versions agree
        env:
          TAG_REF: ${{ github.ref_name }}
        run: bash bin/set-version.sh --check "${TAG_REF#v}"

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Verify ad-code compatibility
        run: composer test:characterization

      - name: Verify coding standards
        run: composer lint:release

      - name: Build release zip
        shell: bash
        run: |
          bash bin/build-release.sh "${RUNNER_TEMP}/dist"
          ZIP="$(find "${RUNNER_TEMP}/dist" -name "${SLUG}-*.zip" | head -n 1)"
          cp "${ZIP}" "${RUNNER_TEMP}/${SLUG}.zip"

      - name: Build Playground bundle
        run: bash bin/build-playground-bundle.sh "${RUNNER_TEMP}/${SLUG}.zip" "${RUNNER_TEMP}/${SLUG}-playground.zip"

      - name: Smoke test Playground bundle
        run: node scripts/test-playground.mjs "${RUNNER_TEMP}/${SLUG}-playground.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ runner.temp }}/quick-adsense.zip
            ${{ runner.temp }}/quick-adsense-playground.zip
          generate_release_notes: true

      - name: Generate release Playground URL
        shell: bash
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          PLAYGROUND_URL="$(node scripts/playground-blueprint.mjs release-url \
            "${GITHUB_REPOSITORY}" \
            "${TAG_REF}")"
          echo "PLAYGROUND_URL=${PLAYGROUND_URL}" >> "${GITHUB_ENV}"

      - name: Add Playground link to release description
        uses: actions/github-script@v9
        env:
          TAG_REF: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const startMarker = '<!-- quick-adsense-playground:start -->';
            const endMarker = '<!-- quick-adsense-playground:end -->';
            const section = [
              startMarker,
              '## Live demo',
              '',
              `[Try this release in WordPress Playground](${process.env.PLAYGROUND_URL})`,
              '',
              'The demo boots WordPress with Quick Adsense active and visible dummy',
              'creatives for automatic, manual, widget, header and footer paths.',
              endMarker,
            ].join('\n');
            const markerPattern = new RegExp(
              `\\n?${startMarker}[\\s\\S]*?${endMarker}\\n?`,
              'g',
            );
            const { owner, repo } = context.repo;
            const release = (
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: process.env.TAG_REF,
              })
            ).data;
            const preservedBody = (release.body || '').replace(markerPattern, '').trimEnd();
            const body = preservedBody ? `${preservedBody}\n\n${section}` : section;

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: Number(release.id),
              body,
            });

  publish-fair:
    name: Publish FAIR metadata
    needs: release
    if: ${{ vars.FAIR_DID != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Publish to FAIR
        uses: fairpm/fair-pulse@v1
        with:
          version: ${{ github.ref_name }}
          artifact-name: quick-adsense.zip
          upload-metadata: 'true'
        env:
          FAIR_VERIFICATION_KEY_PRIVATE: ${{ secrets.FAIR_VERIFICATION_KEY_PRIVATE }}
          FAIR_VERIFICATION_KEY_PUBLIC: ${{ secrets.FAIR_VERIFICATION_KEY_PUBLIC }}
          FAIR_DID: ${{ vars.FAIR_DID }}
