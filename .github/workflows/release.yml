name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: composer test:characterization
      - run: composer lint:release
      - name: Build archive
        run: bash bin/build-release.sh "${RUNNER_TEMP}/dist"
      - name: Upload manual preview
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: quick-adsense-release-preview
          path: ${{ runner.temp }}/dist/*.zip
      - name: Publish GitHub release asset
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/dist/*.zip
          generate_release_notes: true
