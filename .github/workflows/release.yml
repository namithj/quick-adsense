name: Release

# The whole release pipeline, driven by one pushed tag.
#
#   push tag v2.9.2
#     -> version-sync.yml   writes 2.9.2 into every published file, commits it,
#                           and moves the tag onto that commit
#     -> build              builds the release zip and Playground bundle from
#                           the synced commit, publishes the GitHub release and
#                           adds the Playground demo link to its notes
#     -> publish-fair.yml   publishes release metadata to the FAIR network
#
# Every artifact therefore carries the tagged version, because the zips are
# built from the synced commit rather than from the tag as pushed.
#
# Publishing to WordPress.org is deliberately NOT part of this pipeline: SVN is
# a release repository and a push there is public and awkward to undo, so it is
# run by hand from deploy.yml. Nothing is lost by doing so — deploy.yml checks
# out the same synced tag and refuses to run unless the tree it finds carries
# that tag's version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, for example v2.9.2'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Sync version
    permissions:
      contents: write
    uses: ./.github/workflows/version-sync.yml
    with:
      # `inputs` is empty for a tag push, so this resolves to the pushed tag.
      version: ${{ inputs.tag || github.ref_name }}
      tag: ${{ inputs.tag || github.ref_name }}

  build:
    name: Build and publish release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SLUG: quick-adsense
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      # Built from the commit the sync produced, by SHA, so this cannot pick up
      # a stale copy of the tag from a caching layer.
      - name: Checkout synced commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the checked-out tree carries the tagged version
        run: bash bin/set-version.sh --check "${VERSION}"

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      # A broken release is worse than a late one: the suite that guarantees
      # existing users' ad code still renders runs before anything is published.
      - name: Verify ad-code compatibility
        run: composer test:characterization

      - name: Verify coding standards
        run: composer lint:release

      - name: Build release zip
        shell: bash
        run: |
          bash bin/build-release.sh "${RUNNER_TEMP}/dist"
          ZIP="$(find "${RUNNER_TEMP}/dist" -name "${SLUG}-*.zip" | head -n 1)"
          # Release assets use a stable, version-less name so blueprint URLs and
          # download links stay predictable across releases.
          cp "${ZIP}" "${RUNNER_TEMP}/${SLUG}.zip"
          echo "Release asset: ${RUNNER_TEMP}/${SLUG}.zip (built from ${ZIP##*/})"

      - name: Build Playground bundle
        run: bash bin/build-playground-bundle.sh "${RUNNER_TEMP}/${SLUG}.zip" "${RUNNER_TEMP}/${SLUG}-playground.zip"

      - name: Smoke test Playground bundle
        run: node scripts/test-playground.mjs "${RUNNER_TEMP}/${SLUG}-playground.zip"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ runner.temp }}/quick-adsense.zip
            ${{ runner.temp }}/quick-adsense-playground.zip
          generate_release_notes: true

      - name: Generate release Playground URL
        shell: bash
        run: |
          PLAYGROUND_URL="$(node scripts/playground-blueprint.mjs release-url \
            "${GITHUB_REPOSITORY}" \
            "${TAG}")"
          echo "PLAYGROUND_URL=${PLAYGROUND_URL}" >> "${GITHUB_ENV}"

      - name: Add Playground link to release description
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const startMarker = '<!-- quick-adsense-playground:start -->';
            const endMarker = '<!-- quick-adsense-playground:end -->';
            const section = [
              startMarker,
              '## Live demo',
              '',
              `[Try this release in WordPress Playground](${process.env.PLAYGROUND_URL})`,
              '',
              'The demo boots WordPress with Quick Adsense active and visible dummy',
              'creatives for automatic, manual, widget, header and footer paths.',
              endMarker,
            ].join('\n');
            const markerPattern = new RegExp(
              `\\n?${startMarker}[\\s\\S]*?${endMarker}\\n?`,
              'g',
            );
            const { owner, repo } = context.repo;
            const release = (
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: process.env.TAG,
              })
            ).data;
            // Regenerated notes are preserved; only the marked section is replaced.
            const preservedBody = (release.body || '').replace(markerPattern, '').trimEnd();
            const body = preservedBody ? `${preservedBody}\n\n${section}` : section;

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: Number(release.id),
              body,
            });

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Release ${TAG}"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Built from: \`${{ needs.version.outputs.sha }}\`"
            echo "- [Try it in WordPress Playground](${PLAYGROUND_URL})"
            echo
            echo "WordPress.org is not published automatically. To ship this"
            echo "release there, run the **Deploy to WordPress.org** workflow"
            echo "with tag \`${TAG}\` — untick *Dry run* to commit to SVN."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-fair:
    name: Publish FAIR metadata
    needs: [version, build]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-fair.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
