name: Tests

# Test gate for everything that merges into main.
#
# The characterization suite is the safety net for this plugin: it asserts that
# ad code stored by existing users (iframes, JavaScript, AdSense, HTML,
# shortcodes) still renders through every insertion path. It runs on every
# change, on every supported PHP version.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit — PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    # Trunk is reported but never fails the workflow.
    continue-on-error: ${{ matrix.wp == 'trunk' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        wp: ['6.7', 'latest', 'trunk']
        exclude:
          # WordPress 6.7 does not support PHP 8.4 or newer.
          - php: '8.4'
            wp: '6.7'
          - php: '8.5'
            wp: '6.7'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quick_adsense_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_TESTS_DB_NAME: quick_adsense_tests
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      # Runs without WordPress, so it fails fast before the core download.
      - name: Run dependency-free compatibility gate
        run: composer test:characterization

      # wp-phpunit must match the WordPress core under test: 6.7 uses ~6.7.0,
      # latest uses the current release from WordPress.org, trunk uses dev-master.
      - name: Install the matching wp-phpunit
        env:
          WP_CELL: ${{ matrix.wp }}
        run: |
          case "${WP_CELL}" in
            trunk)
              CONSTRAINT='dev-master'
              ;;
            latest)
              CURRENT="$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ | php -r '$d = json_decode( file_get_contents( "php://stdin" ), true ); echo $d["offers"][0]["current"];')"
              CONSTRAINT="~$(cut -d. -f1,2 <<<"${CURRENT}").0"
              ;;
            *)
              CONSTRAINT="~${WP_CELL}.0"
              ;;
          esac
          echo "wp-phpunit constraint: ${CONSTRAINT}"
          composer require --dev --no-update --no-interaction "wp-phpunit/wp-phpunit:${CONSTRAINT}" \
            && composer update wp-phpunit/wp-phpunit --with-dependencies --no-interaction --no-progress

      # wp-phpunit ships the core test library but not WordPress itself, so the
      # suite needs a core checkout to point WP_TESTS_ABSPATH at.
      - name: Install WordPress core
        run: |
          WP_PATH="$(bash bin/install-wp-core.sh "${{ matrix.wp }}" "${RUNNER_TEMP}/wordpress")"
          echo "WP_TESTS_ABSPATH=${WP_PATH}" >> "${GITHUB_ENV}"

      - name: Wait for MySQL
        run: |
          for _ in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; then
              echo "MySQL is up."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time." >&2
          exit 1

      # R00 safety net: 20 realistic user configurations, run one after another
      # against golden-master snapshots taken on v2.9.4 (tests/user-configs/).
      # Any change to what an existing user sees, or to what is stored in their
      # database, fails here. Snapshots are never regenerated in CI.
      - name: User-config regression (20 configs)
        env:
          QA_UPDATE_SNAPSHOTS: '0'
        run: composer test:configs

      - name: Run test suite
        run: composer test

      # WP_Ajax_UnitTestCase tests are excluded from the default run by the core
      # bootstrap, so they need their own invocation. They cover the capability
      # checks and the lossless ad-code save round-trip.
      - name: Run AJAX test suite
        run: composer test:ajax

  playground-bundle:
    name: Playground bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Builds the same two artifacts the release publishes, so a change that
      # breaks packaging or the demo blueprint fails on the pull request rather
      # than half-way through a release.
      - name: Build release zip
        run: bash bin/build-release.sh "${RUNNER_TEMP}/dist"

      - name: Build Playground bundle
        run: |
          ZIP="$(find "${RUNNER_TEMP}/dist" -name 'quick-adsense-*.zip' | head -n 1)"
          bash bin/build-playground-bundle.sh "${ZIP}" "${RUNNER_TEMP}/quick-adsense-playground.zip"

      - name: Smoke test Playground bundle
        run: node scripts/test-playground.mjs "${RUNNER_TEMP}/quick-adsense-playground.zip"
